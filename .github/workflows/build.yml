name: osc-sdk-go release build

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: "Outscale API version"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-build-v3:
    environment: auto-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v3
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Build release
        run: |
          curl --retry 5 --retry-max-time 120 --retry-connrefused https://raw.githubusercontent.com/outscale/osc-api-deploy/refs/tags/${OAPI_VERSION}/outscale.yaml > ./pkg/osc/api.yaml
          make gen
        env:
          OAPI_VERSION: ${{ github.event.inputs.api_version }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "⬆️ deps: upgrade OAPI to version ${{ env.api_version }}"
          body: |
            Automatic build of SDK based on Outscale API ${{ env.api_version }}.
          title: "OAPI ${{ env.api_version }}"
          labels: "kind/feature"
          sign-commits: true
        env:
          api_version: ${{ github.event.inputs.api_version }}
  auto-build-v2:
    environment: auto-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.23
      - name: Write Outscale API version to use
        run: echo "$API_VERSION" > api_version
        env:
          API_VERSION: ${{ github.event.inputs.api_version }}
      - name: check for release duplicate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: make release-check-duplicate
      - name: auto-generate release
        run: make release-build
      - name: push release branch
        run: make release-push
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: create pull request
        run: make release-pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
