overlay: 1.0.0
info:
  title: "Example to indicate how to use the OpenAPI Overlay specification (https://github.com/OAI/Overlay-Specification)"
  version: 1.0.0
actions:
  - target: $.components.schemas.Snapshot.properties.State
    update:
      enum:
      - in-queue
      - pending
      - completed
      - error
      - deleting
  - target: $.components.schemas.Volume.properties.type
    update:
      enum:
        - gp2
        - io1
        - standard
  - target: $.paths./projects.get.parameters
  - target: $.components.schemas
    update:
      ProjectStatus:
        type: string
        enum:
          - pending
          - ready
          - deploying
          - updating
          - upgrading
          - failed
          - deleting
  - target: $.components.schemas.Project.properties.status
    delete: true
  - target: $.components.schemas.Project.properties
    update:
      status:
        $ref: '#/components/schemas/ProjectStatus'
  - target: $.paths./projects.get.parameters.*[?(@.name == "status")].schema
    delete: true
  - target: $.paths./projects.get.parameters.*[?(@.name == "status")]
    update:
        schema:
          $ref: '#/components/schemas/ProjectStatus'
  - target: $.paths./myip
    remove: true
  - target: $.paths["/templates/cluster"].get.parameters.*[?(@.name == "X-Real-IP")]
    remove: true
  - target: $.components.schemas
    update:
      ResponseContext:
        additionalProperties: false
        description: Information about the context of the response.
        properties:
          RequestId:
            description: The ID of the request.
            type: string
        type: object
  - target: $.components.schemas.*.properties.ResponseContext
    update:
      "$ref": "#/components/schemas/ResponseContext"

