  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: A header in the form `Basic XXXX`, where `XXXX` is the Base64 encoding of your root account's login and password joined by a colon (`:`). Note that with Curl, you can use the `--user LOGIN:PASSWORD` option as a shortcut for this and Curl will format the header for you.
    AccessKeyAuth:
      type: apiKey
      in: header
      name: AccessKey
      description: A header with an access key of your root account. You cannot use EIM users' access keys with OKS.
    SecretKeyAuth:
      type: apiKey
      in: header
      name: SecretKey
      description: A header with the corresponding secret key of the access key.
    AccessTokenAuth:
      type: apiKey
      in: header
      name: AccessToken
      description: In the case of JWT authentication, a header with an access token.
    RefreshTokenAuth:
      type: apiKey
      in: header
      name: RefreshToken
      description: In the case of JWT authentication, a header with the corresponding refresh token.
    OTPCodeAuth:
      type: apiKey
      in: header
      name: X-OTP-Code
      description: (optional) If multi-factor authentication (MFA) is set up on your account, a header with your OTP token.
security:
- BasicAuth: []
  OTPCodeAuth: []
- AccessKeyAuth: []
  SecretKeyAuth: []
  OTPCodeAuth: []
- AccessTokenAuth: []
  RefreshTokenAuth: []
