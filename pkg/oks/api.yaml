components:
  schemas:
    AdmissionFlags:
      properties:
        applied_admission_plugins:
          default:
          - CertificateApproval
          - CertificateSigning
          - CertificateSubjectRestriction
          - ClusterTrustBundleAttest
          - DefaultIngressClass
          - DefaultStorageClass
          - DefaultTolerationSeconds
          - LimitRanger
          - MutatingAdmissionWebhook
          - NamespaceLifecycle
          - PersistentVolumeClaimResize
          - PodSecurity
          - Priority
          - ResourceQuota
          - RuntimeClass
          - ServiceAccount
          - StorageObjectInUseProtection
          - TaintNodesByCondition
          - ValidatingAdmissionPolicy
          - ValidatingAdmissionWebhook
          description: The list of admission plugins that are currently applied to
            the cluster.
          items:
            type: string
          title: Applied Admission Plugins
          type: array
        disable_admission_plugins:
          default: []
          description: The list of Kubernetes admission plugins that are disabled.
          items:
            type: string
          title: Disable Admission Plugins
          type: array
        enable_admission_plugins:
          default: []
          description: The list of Kubernetes admission plugins that are enabled.
          items:
            type: string
          title: Enable Admission Plugins
          type: array
      title: AdmissionFlags
      type: object
    AdmissionFlagsInput:
      properties:
        disable_admission_plugins:
          default: []
          description: The list of Kubernetes admission plugins to disable.
          items:
            type: string
          title: Disable Admission Plugins
          type: array
        enable_admission_plugins:
          default: []
          description: The list of Kubernetes admission plugins to enable.
          items:
            type: string
          title: Enable Admission Plugins
          type: array
      title: AdmissionFlagsInput
      type: object
    AutoMaintenances:
      properties:
        minor_upgrade_maintenance:
          allOf:
          - $ref: '#/components/schemas/MaintenanceWindow'
          description: The maintenance window configuration for minor Kubernetes upgrades.
          title: Minor Upgrade Maintenance
        patch_upgrade_maintenance:
          allOf:
          - $ref: '#/components/schemas/MaintenanceWindow'
          description: The maintenance window configuration for patch Kubernetes upgrades.
          title: Patch Upgrade Maintenance
      required:
      - minor_upgrade_maintenance
      - patch_upgrade_maintenance
      title: AutoMaintenances
      type: object
    AutoUpgradeMaintenance:
      properties:
        durationHours:
          description: The duration of the maintenance window, in hours.
          title: Duration Hours
          type: integer
        startHour:
          description: The starting time of the maintenance window, in hours.
          maximum: 23.0
          minimum: 0.0
          title: Start Hour
          type: integer
        weekDay:
          description: The weekday on which the maintenance window begins.
          enum:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
          title: Week Day
          type: string
      required:
      - durationHours
      - startHour
      - weekDay
      title: AutoUpgradeMaintenance
      type: object
    CPSubregionsResponse:
      properties:
        CPSubregions:
          description: The list of Subregions where you can deploy control planes
            for your clusters.
          items:
            type: string
          title: CP Subregions
          type: array
        ResponseContext:
          allOf:
          - $ref: '#/components/schemas/clusters__cluster_schema__ResponseContext'
          description: Information about the context of the response.
          title: Response Context
      required:
      - ResponseContext
      - CPSubregions
      type: object
    Cluster:
      properties:
        admin_lbu:
          description: If true, load balancer administration is enabled for cluster
            management. If false, it is disabled.
          title: Admin LBU
          type: boolean
        admin_whitelist:
          description: The list of CIDR blocks or IP addresses allowed to access the
            cluster via the Kubernetes API.
          items:
            type: string
          title: Admin Whitelist
          type: array
        admission_flags:
          allOf:
          - $ref: '#/components/schemas/AdmissionFlags'
          default:
            applied_admission_plugins:
            - CertificateApproval
            - CertificateSigning
            - CertificateSubjectRestriction
            - ClusterTrustBundleAttest
            - DefaultIngressClass
            - DefaultStorageClass
            - DefaultTolerationSeconds
            - LimitRanger
            - MutatingAdmissionWebhook
            - NamespaceLifecycle
            - PersistentVolumeClaimResize
            - PodSecurity
            - Priority
            - ResourceQuota
            - RuntimeClass
            - ServiceAccount
            - StorageObjectInUseProtection
            - TaintNodesByCondition
            - ValidatingAdmissionPolicy
            - ValidatingAdmissionWebhook
            disable_admission_plugins: []
            enable_admission_plugins: []
          description: The configuration of the Kubernetes admission controllers.
          title: Admission Flags
        auto_maintenances:
          allOf:
          - $ref: '#/components/schemas/AutoMaintenances'
          description: The configuration of the automated maintenance windows.
          title: Auto Maintenances
        cidr_pods:
          description: The CIDR block of the Kubernetes pods' network.
          nullable: true
          title: Pods CIDR
          type: string
        cidr_service:
          description: The CIDR block of the Kubernetes services' network.
          nullable: true
          title: Service CIDR
          type: string
        cluster_dns:
          description: The IP address of the cluster's DNS service.
          nullable: true
          title: Cluster DNS
          type: string
        cni:
          description: The Container Network Interface (CNI) used in the cluster.
          title: CNI
          type: string
        control_planes:
          description: The control plane sizing of the cluster.
          title: Control Planes
          type: string
        cp_subregions:
          description: The Subregions on which the control plane components are deployed.
          items:
            type: string
          title: Control Plane Subregions
          type: array
        description:
          description: An optional description of the cluster.
          nullable: true
          title: Description
          type: string
        disable_api_termination:
          default: false
          description: If true, cluster deletion through the API is disabled. If false,
            it is enabled.
          example: false
          title: Disable API Termination
          type: boolean
        id:
          description: The Universally Unique Identifier (UUID) of the cluster.
          title: Cluster ID
          type: string
        name:
          description: A unique name for the cluster within the project.
          title: Cluster Name
          type: string
        project_id:
          description: The ID of the project this cluster belongs to.
          title: Project ID
          type: string
        statuses:
          allOf:
          - $ref: '#/components/schemas/Statuses'
          description: The status information of the cluster.
        tags:
          additionalProperties:
            description: Additional information about tags.
            type: string
          description: The key/value combinations of the tags associated with the
            cluster, in the following format&#58; "tags":{"TAGKEY1":"TAGVALUE1","TAGKEY2":"TAGVALUE2"}.
          example:
            key: value
          title: Tags
          type: object
        version:
          description: The Kubernetes version deployed for the cluster. For more information,
            see [GetKubernetesVersions](#getkubenetesversions).
          title: Kubernetes Version
          type: string
      required:
      - project_id
      - id
      - name
      - cp_subregions
      - version
      - cni
      - admin_lbu
      - cidr_pods
      - cidr_service
      - cluster_dns
      - tags
      - auto_maintenances
      - control_planes
      - admin_whitelist
      - statuses
      title: Cluster
      type: object
    ClusterInput-Input:
      properties:
        admin_lbu:
          default: false
          description: If true, load balancer administration is enabled for cluster
            management. If false, it is disabled.
          title: Admin LBU
          type: boolean
        admin_whitelist:
          description: The list of CIDR blocks or IP addresses allowed to access the
            cluster via the Kubernetes API.
          items:
            type: string
          title: Admin Whitelist
          type: array
        admission_flags:
          allOf:
          - $ref: '#/components/schemas/AdmissionFlagsInput'
          default:
            disable_admission_plugins: []
            enable_admission_plugins: []
          description: The configuration for Kubernetes admission controllers.
          title: Admission Flags
        auto_maintenances:
          allOf:
          - $ref: '#/components/schemas/AutoMaintenances'
          description: The configurations for automated maintenance windows.
          title: Auto Maintenances
        cidr_pods:
          description: The CIDR block for Kubernetes pods' network.
          example: 10.91.0.0/16
          title: Pods CIDR
          type: string
        cidr_service:
          description: The CIDR block for the Kubernetes services' network.
          example: 10.92.0.0/16
          title: Service CIDR
          type: string
        cluster_dns:
          description: The IP address for the cluster's DNS service.
          example: 10.92.0.10
          title: Cluster DNS
          type: string
        control_planes:
          default: cp.3.masters.small
          description: The size of control plane deployment for the cluster. For more
            information, see [About OKS > Control Planes](https://docs.outscale.com/en/userguide/About-OKS.html#_control_planes).
          title: Control Planes
          type: string
        cp_subregions:
          default:
          - 2a
          description: The list of Subregions where control plane components are deployed.
          items:
            type: string
          title: Control Plane Subregions
          type: array
        description:
          description: A description of the cluster.
          nullable: true
          title: Description
          type: string
        disable_api_termination:
          default: false
          description: If true, cluster deletion through the API is disabled. If false,
            it is enabled.
          example: false
          title: Disable API Termination
          type: boolean
        name:
          description: A unique name for the cluster within the project.
          example: awesome-cluster
          maxLength: 40
          minLength: 1
          pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
          title: Cluster Name
          type: string
        project_id:
          description: The ID of the project in which you want to create a cluster.
          title: Project ID
          type: string
        quirks:
          description: The list of special configurations or behaviors for the cluster.
          nullable: true
          title: Quirks
          type: array
        tags:
          additionalProperties:
            description: Additional information about tags.
            type: string
          description: The key/value combinations of the tags associated with the
            cluster's metadata, in the following format&#58; "tags":{"TAGKEY1":"TAGVALUE1","TAGKEY2":"TAGVALUE2"}.
          example:
            key: value
          title: Tags
          type: object
        version:
          default: '1.30'
          description: The Kubernetes version to be deployed for the cluster. For
            more information, see [GetKubernetesVersions](#getkubenetesversions).
          title: Kubernetes Version
          type: string
      required:
      - name
      - project_id
      - auto_maintenances
      - admin_whitelist
      type: object
    ClusterInput-Output:
      properties:
        admin_lbu:
          default: false
          description: If true, the admin load balancer for cluster management is
            enabled.
          title: Admin LBU
          type: boolean
        admin_whitelist:
          description: The list of CIDR blocks or IP addresses allowed to access the
            cluster via the Kubernetes API.
          items:
            type: string
          title: Admin Whitelist
          type: array
        admission_flags:
          allOf:
          - $ref: '#/components/schemas/AdmissionFlagsInput'
          default:
            disable_admission_plugins: []
            enable_admission_plugins: []
          description: The configuration for the Kubernetes admission controllers.
          title: Admission Flags
        auto_maintenances:
          allOf:
          - $ref: '#/components/schemas/AutoMaintenances'
          description: The configuration for the automated maintenance windows.
          title: Auto Maintenances
        cidr_pods:
          description: The CIDR block of the Kubernetes pods' network.
          example: 10.91.0.0/16
          title: Pods CIDR
          type: string
        cidr_service:
          description: The CIDR block of the Kubernetes pods' network.
          example: 10.92.0.0/16
          title: Service CIDR
          type: string
        cluster_dns:
          description: The IP address for the cluster DNS service.
          example: 10.92.0.10
          title: Cluster DNS
          type: string
        control_planes:
          default: cp.3.masters.small
          description: The control plane type of the cluster.
          title: Control Planes
          type: string
        cp_subregions:
          default:
          - 2a
          description: A list of Subregions where control plane components are deployed.
          items:
            type: string
          title: Control Plane Subregions
          type: array
        description:
          description: The description of the cluster.
          nullable: true
          title: Description
          type: string
        disable_api_termination:
          default: false
          description: If true, cluster deletion through the API is disabled. If false,
            it is enabled.
          example: false
          title: Disable API Termination
          type: boolean
        name:
          description: A unique cluster name per project. Must start with a letter
            and contain only lowercase letters, numbers, or hyphens.
          example: awesome-cluster
          maxLength: 40
          minLength: 1
          pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
          title: Cluster Name
          type: string
        project_id:
          description: The ID of the project to which this cluster belongs to.
          title: Project ID
          type: string
        quirks:
          description: A list of special configurations or behaviors for the cluster.
          nullable: true
          title: Quirks
          type: array
        tags:
          additionalProperties:
            description: Additional information about tags.
            type: string
          description: 'The key/value combinations of the tags associated with the
            cluster''s metadata, in the following format: "tags":{"TAGKEY1":"TAGVALUE1","TAGKEY2":"TAGVALUE2"}.'
          example:
            key: value
          title: Tags
          type: object
        version:
          default: '1.30'
          description: The Kubernetes version deployed for the cluster. For more information,
            see [GetKubernetesVersions](#getkubenetesversions).
          title: Kubernetes Version
          type: string
      required:
      - name
      - project_id
      - auto_maintenances
      - admin_whitelist
      type: object
    ClusterResponse:
      properties:
        Cluster:
          $ref: '#/components/schemas/Cluster'
        ResponseContext:
          $ref: '#/components/schemas/clusters__cluster_schema__ResponseContext'
          description: Information about the context of the response.
      required:
      - ResponseContext
      - Cluster
      type: object
    ClusterResponseList:
      properties:
        Clusters:
          items:
            $ref: '#/components/schemas/Cluster'
          title: Clusters
          type: array
        ResponseContext:
          $ref: '#/components/schemas/clusters__cluster_schema__ResponseContext'
          description: Information about the context of the response.
      required:
      - ResponseContext
      - Clusters
      type: object
    ClusterUpdate:
      properties:
        admin_whitelist:
          description: The updated list of CIDR blocks or IP addresses allowed to
            access the cluster via the Kubernetes API.
          nullable: true
          title: Admin Whitelist
          type: array
        admission_flags:
          allOf:
          - $ref: '#/components/schemas/AdmissionFlagsInput'
          nullable: true
          description: The updated configuration for the Kubernetes admission controllers.
          title: Admission Flags
        auto_maintenances:
          allOf:
          - $ref: '#/components/schemas/AutoMaintenances'
          nullable: true
          description: The updated configuration for the automated maintenance windows.
          title: Auto Maintenances
        description:
          description: The updated description of the cluster.
          nullable: true
          title: Description
          type: string
        disable_api_termination:
          description: If true, cluster deletion through the API is disabled. If false,
            it is enabled.
          nullable: true
          title: Disable API Termination
          type: boolean
        quirks:
          description: The updated list of special configurations or behaviors for
            the cluster.
          nullable: true
          title: Quirks
          type: array
        tags:
          description: 'The updated key/value combinations of the tags associated
            with the cluster''s metadata, in the following format: "tags":{"TAGKEY1":"TAGVALUE1","TAGKEY2":"TAGVALUE2"}.'
          nullable: true
          title: Tags
          type: object
        version:
          description: The updated version of Kubernetes for the cluster. For more
            information, see [GetKubernetesVersions](#getkubenetesversions).
          nullable: true
          title: Kubernetes Version
          type: string
      title: ClusterUpdate
      type: object
    ControlPlanesResponse:
      properties:
        ControlPlanes:
          description: The list of available control plane types.
          items:
            type: string
          title: Control Planes
          type: array
        ResponseContext:
          $ref: '#/components/schemas/clusters__cluster_schema__ResponseContext'
          description: Information about the context of the response.
      required:
      - ResponseContext
      - ControlPlanes
      type: object
    DetailResponse:
      properties:
        ResponseContext:
          $ref: '#/components/schemas/projects__project_schema__ResponseContext'
          description: Information about the context of the response.
        detail:
          description: A detailed message related to the API response.
          title: Detail
          type: string
      required:
      - ResponseContext
      - detail
      title: DetailResponse
      type: object
    HTTPValidationError:
      properties:
        Errors:
          type: array
          items:
            type: object
            properties:
              Details:
                oneOf:
                - items:
                    $ref: '#/components/schemas/ValidationError'
                  title: Detail
                  type: array
                - type: string
      title: HTTPValidationError
      type: object
    KubeconfigData:
      properties:
        kubeconfig:
          description: A file containing access configuration to the cluster.
          title: Kubeconfig
          type: string
        name:
          description: The name of the cluster.
          title: Name
          type: string
      required:
      - name
      - kubeconfig
      title: KubeconfigData
      type: object
    KubeconfigResponse:
      properties:
        Cluster:
          $ref: '#/components/schemas/clusters__cluster_schema__RPCResponse'
        ResponseContext:
          $ref: '#/components/schemas/clusters__cluster_schema__ResponseContext'
          description: Information about the context of the response.
      required:
      - ResponseContext
      - Cluster
      type: object
    KubernetesVersionsResponse:
      properties:
        ResponseContext:
          $ref: '#/components/schemas/clusters__cluster_schema__ResponseContext'
          description: Information about the context of the response.
        Versions:
          description: A list of available Kubernetes versions.
          items:
            type: string
          title: Versions
          type: array
      required:
      - ResponseContext
      - Versions
      type: object
    MaintenanceWindow:
      properties:
        duration_hours:
          default: 0
          description: The duration of the maintenance window, in hours.
          maximum: 23.0
          minimum: 0.0
          title: Duration Hours
          type: integer
        enabled:
          default: true
          description: If true, a maintenance window is enabled.
          title: Enabled
          type: boolean
        start_hour:
          default: 12
          description: The starting time of the maintenance window, in hours.
          maximum: 23.0
          minimum: 0.0
          title: Start Hour
          type: integer
        tz:
          default: UTC
          description: The timezone for the maintenance window.
          title: Timezone
          type: string
        week_day:
          default: Tue
          description: The weekday on which the maintenance window begins.
          enum:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
          - string
          title: Week Day
          type: string
      title: MaintenanceWindow
      type: object
    Metadata:
      properties:
        name:
          description: An ID for the node pool.
          title: Name
          type: string
      required:
      - name
      title: Metadata
      type: object
    Nodepool:
      properties:
        apiVersion:
          description: The node pool API version in use.
          title: API Version
          type: string
        kind:
          description: The resource type, always `Nodepool` for node pool resources.
          title: Kind
          type: string
        metadata:
          allOf:
          - $ref: '#/components/schemas/Metadata'
          description: The metadata information for the node pool.
        spec:
          allOf:
          - $ref: '#/components/schemas/Spec'
          description: The specification for the node pool configuration.
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: Nodepool
      type: object
    Project:
      properties:
        cidr:
          description: The CIDR block associated with the Net of the project.
          title: VPC CIDR
          type: string
        created_at:
          description: The timestamp when the project was created.
          format: date-time
          title: Created At
          type: string
        deleted_at:
          description: The timestamp when the project was deleted (if applicable).
          nullable: true
          title: Deleted At
          type: string
        description:
          description: A description for the project.
          nullable: true
          title: Description
          type: string
        disable_api_termination:
          default: false
          description: If true, project deletion through the API is disabled. If false,
            it is enabled.
          example: false
          title: Disable API Termination
          type: boolean
        id:
          description: The ID of the project.
          title: Project ID
          type: string
        name:
          description: The name of the project.
          title: Project Name
          type: string
        region:
          description: The Region on which the project is deployed.
          title: Region
          type: string
        status:
          description: The status of the project.
          title: Status
          type: string
        tags:
          additionalProperties:
            description: Additional information about tags.
            type: string
          description: 'The key/value combinations of the tags associated with the
            resource, in the following format: "tags":{"TAGKEY1":"TAGVALUE1","TAGKEY2":"TAGVALUE2"}.'
          title: Tags
          type: object
        updated_at:
          description: The timestamp when the project was last updated.
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - name
      - cidr
      - region
      - status
      - tags
      - created_at
      - updated_at
      title: Project
      type: object
    ProjectInput:
      properties:
        cidr:
          description: The CIDR block to associate with the Net of the project.
          title: VPC CIDR
          type: string
        description:
          description: A description for the project.
          title: Description
          type: string
        disable_api_termination:
          default: false
          description: If true, project deletion through the API is disabled. If false,
            it is enabled.
          example: false
          title: Disable API Termination
          type: boolean
        name:
          description: A unique name for the project. Must start with a letter and
            contain only lowercase letters, numbers, or hyphens.
          example: awesome-project
          maxLength: 40
          minLength: 1
          pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
          title: Project Name
          type: string
        quirks:
          description: A list of special configurations or behaviors for the project.
          nullable: true
          title: Quirks
          type: array
        region:
          description: The Region on which the project is deployed.
          title: Region
          type: string
        tags:
          description: 'The key/value combinations of the tags associated with the
            resource, in the following format: "tags":{"TAGKEY1":"TAGVALUE1","TAGKEY2":"TAGVALUE2"}.'
          example:
            key: value
          title: Tags
          type: object
      required:
      - name
      - cidr
      - region
      title: ProjectInput
      type: object
    ProjectResponse:
      properties:
        Project:
          $ref: '#/components/schemas/Project'
        ResponseContext:
          $ref: '#/components/schemas/projects__project_schema__ResponseContext'
          description: Information about the context of the response.
      required:
      - ResponseContext
      - Project
      type: object
    ProjectResponseList:
      properties:
        Projects:
          description: The list of retrieved projects.
          items:
            $ref: '#/components/schemas/Project'
          title: Projects
          type: array
        ResponseContext:
          $ref: '#/components/schemas/projects__project_schema__ResponseContext'
          description: Information about the context of the response.
      required:
      - ResponseContext
      - Projects
      title: ProjectResponseList
      type: object
    ProjectUpdate:
      properties:
        description:
          description: The updated description for the project.
          nullable: true
          title: Description
          type: string
        disable_api_termination:
          description: If true, project deletion through the API is disabled. If false,
            it is enabled.
          nullable: true
          title: Disable API Termination
          type: boolean
        quirks:
          description: The updated list of special configurations or behaviors for
            the project.
          nullable: true
          title: Quirks
          type: array
        tags:
          description: "The updated key/value combinations of the tags associated\
            \ with the project\u2019s metadata, in the following format: \"tags\"\
            :{\"TAGKEY1\":\"TAGVALUE1\",\"TAGKEY2\":\"TAGVALUE2\"}."
          example:
            key: value
          nullable: true
          title: Tags
          type: object
      title: ProjectUpdate
      type: object
    Quotas:
      properties:
        AccountId:
          description: The ID of the account.
          title: Account ID
          type: string
        Description:
          description: A detailed description of the quota.
          title: Description
          type: string
        MaxValue:
          description: The maximum allowed value for the quota.
          title: Max Value
          type: integer
        Name:
          description: The name of the quota.
          title: Name
          type: string
        QuotaCollection:
          description: A category or group to which the quota belongs to.
          title: Quota Collection
          type: string
        ShortDescription:
          description: A brief summary of the quota.
          title: Short Description
          type: string
        UsedValue:
          description: The current usage value for the quota.
          title: Used Value
          type: integer
      required:
      - ShortDescription
      - QuotaCollection
      - AccountId
      - Description
      - MaxValue
      - UsedValue
      - Name
      title: Quotas
      type: object
    QuotasData:
      properties:
        quotas:
          description: A list of quota details.
          items:
            $ref: '#/components/schemas/Quotas'
          title: Quotas
          type: array
      required:
      - quotas
      title: QuotasData
      type: object
    QuotasResponse:
      properties:
        Project:
          allOf:
          - $ref: '#/components/schemas/projects__project_schema__RPCResponse'
          description: The quota details associated with the project.
          title: Project Quotas
        ResponseContext:
          $ref: '#/components/schemas/projects__project_schema__ResponseContext'
          description: Information about the context of the response.
      required:
      - ResponseContext
      - Project
      title: QuotasResponse
      type: object
    Spec:
      properties:
        autoHealing:
          description: If true, the automatic healing of failed nodes is enabled.
          title: Auto Healing
          type: boolean
        desiredNodes:
          description: The number of desired nodes in the node pool.
          title: Desired Nodes
          type: string
        nodeType:
          description: The type of VM for the nodes.
          title: Node Type
          type: string
        upgradeStrategy:
          allOf:
          - $ref: '#/components/schemas/UpgradeStrategy'
          description: The configuration for managing node pool upgrades.
          title: Upgrade Strategy
        volumes:
          description: A list of volume configurations for the nodes.
          items:
            $ref: '#/components/schemas/Volume'
          title: Volumes
          type: array
        zones:
          description: A list of Subregions where nodes should be deployed.
          items:
            type: string
          title: Zones
          type: array
      required:
      - desiredNodes
      - nodeType
      - zones
      - volumes
      - upgradeStrategy
      - autoHealing
      title: Spec
      type: object
    Statuses:
      properties:
        available_upgrade:
          default: ''
          description: Any available version of Kubernetes for upgrade (if applicable).
            For more information, see [GetKubernetesVersions](#getkubenetesversions).
          title: Available Upgrade
          type: string
        created_at:
          description: The timestamp when the cluster was created.
          format: date-time
          title: Created At
          type: string
        deleted_at:
          description: The timestamp when the cluster was deleted (if applicable).
          nullable: true
          title: Deleted At
          type: string
        status:
          description: The status of the cluster.
          nullable: true
          title: Status
          type: string
        updated_at:
          description: The timestamp when the cluster was last updated.
          nullable: true
          title: Updated At
          type: string
      required:
      - created_at
      title: Statuses
      type: object
    TemplateResponse_ClusterInput_:
      properties:
        ResponseContext:
          $ref: '#/components/schemas/templates__template_schema__ResponseContext'
          description: Information about the context of the response.
        Template:
          allOf:
          - $ref: '#/components/schemas/ClusterInput-Output'
          description: The returned template resource.
          title: Template
      required:
      - ResponseContext
      - Template
      title: TemplateResponse[ClusterInput]
      type: object
    TemplateResponse_Nodepool_:
      properties:
        ResponseContext:
          $ref: '#/components/schemas/templates__template_schema__ResponseContext'
          description: Information about the context of the response.
        Template:
          allOf:
          - $ref: '#/components/schemas/Nodepool'
          description: The returned template resource.
          title: Template
      required:
      - ResponseContext
      - Template
      title: TemplateResponse[Nodepool]
      type: object
    TemplateResponse_ProjectInput_:
      properties:
        ResponseContext:
          $ref: '#/components/schemas/templates__template_schema__ResponseContext'
          description: Information about the context of the response.
        Template:
          allOf:
          - $ref: '#/components/schemas/ProjectInput'
          description: The returned template resource.
          title: Template
      required:
      - ResponseContext
      - Template
      title: TemplateResponse[ProjectInput]
      type: object
    UpgradeStrategy:
      properties:
        autoUpgradeEnabled:
          description: If true, automatic upgrades for the node pool are enabled.
          title: Auto Upgrade Enabled
          type: boolean
        autoUpgradeMaintenance:
          allOf:
          - $ref: '#/components/schemas/AutoUpgradeMaintenance'
          description: The configuration for the automated upgrade maintenance window.
          title: Auto Upgrade Maintenance
        maxSurge:
          description: The maximum number of extra nodes that can be created during
            an upgrade.
          title: Max Surge
          type: integer
        maxUnavailable:
          description: The maximum number of nodes that can be unavailable during
            an upgrade.
          title: Max Unavailable
          type: integer
      required:
      - maxUnavailable
      - maxSurge
      - autoUpgradeEnabled
      - autoUpgradeMaintenance
      title: UpgradeStrategy
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Volume:
      properties:
        device:
          description: The device name for the volume.
          title: Device
          type: string
        dir:
          description: The mount point directory path for the volume.
          title: Directory
          type: string
        size:
          description: The size of the volume.
          title: Size
          type: integer
        type:
          description: The type of the volume (gp2, io1, standard).
          title: Type
          type: string
      required:
      - device
      - type
      - size
      - dir
      title: Volume
      type: object
    clusters__cluster_schema__RPCResponse:
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/KubeconfigData'
          description: The kubeconfig data for the cluster.
          title: Data
        request_id:
          description: The ID of the API request.
          title: Request ID
          type: string
      required:
      - request_id
      - data
      type: object
    clusters__cluster_schema__ResponseContext:
      properties:
        RequestId:
          description: The ID of the API request.
          title: Request ID
          type: string
      required:
      - RequestId
      type: object
    projects__project_schema__RPCResponse:
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/QuotasData'
          description: The quota information related to the request.
          title: Data
        request_id:
          description: The ID of the API request.
          title: Request ID
          type: string
      required:
      - request_id
      - data
      type: object
    projects__project_schema__ResponseContext:
      properties:
        RequestId:
          description: The ID of the API request.
          title: Request ID
          type: string
      required:
      - RequestId
      type: object
    templates__template_schema__ResponseContext:
      properties:
        RequestId:
          description: The ID of the API request.
          title: Request ID
          type: string
      required:
      - RequestId
      type: object
  securitySchemes:
    AccessKeyAuth:
      description: A header with an access key of your root acount. You cannot use
        EIM users' access keys with OKS.
      in: header
      name: AccessKey
      type: apiKey
    AccessTokenAuth:
      description: In the case of JWT authentication, a header with an access token.
      in: header
      name: AccessToken
      type: apiKey
    BasicAuth:
      description: A header in the form `Basic XXXX`, where `XXXX` is the Base64 encoding
        of your root account's login and password joined by a colon (`:`). Note that
        with Curl, you can use the `--user LOGIN:PASSWORD` option as a shortcut for
        this and Curl will format the header for you.
      scheme: basic
      type: http
    OTPCodeAuth:
      description: (optional) If multi-factor authentication (MFA) is set up on your
        account, a header with your OTP token.
      in: header
      name: X-OTP-Code
      type: apiKey
    RefreshTokenAuth:
      description: In the case of JWT authentication, a header with the corresponding
        refresh token.
      in: header
      name: RefreshToken
      type: apiKey
    SecretKeyAuth:
      description: A header with the corresponding secret key of the access key.
      in: header
      name: SecretKey
      type: apiKey
info:
  description: "The OKS API enables you to interact with OUTSCALE Kubernetes as a\
    \ Service (OKS), a managed Kubernetes service on the OUTSCALE Cloud.\n\nIn OKS,\
    \ each cluster is linked to a project. In a project, you can have several clusters.\
    \ Templates are also available for different resources.<br />For more information\
    \ about the service, see [About OKS](https://docs.outscale.com/en/userguide/About-OKS.html).\n\
    \n An OpenAPI description of this API is also available for download here: [oks.yaml](https://docs.outscale.com/_attachments/oks.yaml).\n"
  title: OKS API
  version: '1.0'
openapi: 3.1.0
paths:
  /clusters:
    get:
      description: Lists one or more clusters associated with a project. The response
        can be filtered using the parameters.
      operationId: ListClustersByProjectID
      parameters:
      - description: The ID of the project.
        in: query
        name: project_id
        required: false
        schema:
          nullable: true
          title: Project Id
          type: string
      - description: The name of the clusters.
        in: query
        name: name
        required: false
        schema:
          nullable: true
          title: Name
          type: string
      - description: The status of the clusters.
        in: query
        name: status
        required: false
        schema:
          nullable: true
          title: Status
          type: string
      - description: The version of the clusters.
        in: query
        name: version
        required: false
        schema:
          nullable: true
          title: Version
          type: string
      - description: If true, returns deleted clusters.
        in: query
        name: deleted
        required: false
        schema:
          nullable: true
          title: Deleted
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponseList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Clusters
      tags:
      - Clusters
    post:
      description: Creates a cluster with the provided configuration.
      operationId: CreateCluster
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInput-Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Create Cluster
      tags:
      - Clusters
  /clusters/all:
    get:
      description: Lists one or more of your clusters. The response can be filtered
        using the parameters.
      operationId: ListAllClusters
      parameters:
      - description: The name of the clusters.
        in: query
        name: name
        required: false
        schema:
          nullable: true
          title: Name
          type: string
      - description: The status of the clusters.
        in: query
        name: status
        required: false
        schema:
          nullable: true
          title: Status
          type: string
      - description: The version of the clusters.
        in: query
        name: version
        required: false
        schema:
          nullable: true
          title: Version
          type: string
      - description: If true, returns deleted clusters.
        in: query
        name: deleted
        required: false
        schema:
          nullable: true
          title: Deleted
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponseList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get All Clusters
      tags:
      - Clusters
  /clusters/limits/control_plane_plans:
    get:
      description: Gets the control plane types that you can use to create your clusters.
      operationId: GetControlPlanePlans
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPlanesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Control Plane Plans
      tags:
      - Clusters
  /clusters/limits/cp_subregions:
    get:
      description: Gets the Subregions where you can deploy control planes for your
        clusters.
      operationId: GetCPSubregions
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CPSubregionsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Cp Subregions
      tags:
      - Clusters
  /clusters/limits/kubernetes_versions:
    get:
      description: Gets the available Kubernetes versions for cluster creation or
        upgrades.
      operationId: GetKubenetesVersions
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesVersionsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Kubernetes Versions
      tags:
      - Clusters
  /clusters/{cluster_id}:
    delete:
      description: Deletes a specific cluster.
      operationId: DeleteCluster
      parameters:
      - description: The ID of the cluster.
        in: path
        name: cluster_id
        required: true
        schema:
          title: Cluster Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Delete Cluster
      tags:
      - Clusters
    get:
      description: Gets information about a specific cluster.
      operationId: GetCluster
      parameters:
      - description: The name of the cluster.
        in: path
        name: cluster_id
        required: true
        schema:
          title: Cluster Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Cluster
      tags:
      - Clusters
    patch:
      description: Updates the configuration of an existing cluster.
      operationId: UpdateCluster
      parameters:
      - description: The ID of the cluster.
        in: path
        name: cluster_id
        required: true
        schema:
          title: Cluster Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Update Cluster
      tags:
      - Clusters
  /clusters/{cluster_id}/kubeconfig:
    get:
      description: Gets the kubeconfig file for a specific cluster. You can specify
        query parameters for the kubeconfig file.
      operationId: GetKubeconfig
      parameters:
      - description: The ID of the cluster.
        in: path
        name: cluster_id
        required: true
        schema:
          title: Cluster Id
          type: string
      - description: The user of the kubeconfig file.
        in: query
        name: user
        required: false
        schema:
          nullable: true
          title: User
          type: string
      - description: The group of the kubeconfig file.
        in: query
        name: group
        required: false
        schema:
          nullable: true
          title: Group
          type: string
      - description: The time to live (TTL) of the kubeconfig file.
        in: query
        name: ttl
        required: false
        schema:
          nullable: true
          title: Ttl
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubeconfigResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Cluster Kubeconfig
      tags:
      - Clusters
    post:
      description: Gets the kubeconfig file for a specific cluster, optionally encrypted
        with a NaCl public key. For more information, see the [NaCl website](https://nacl.cr.yp.to/).
        You can specify query parameters for the kubeconfig file.
      operationId: GetKubeconfigWithPubkeyNACL
      parameters:
      - description: The ID of the cluster.
        in: path
        name: cluster_id
        required: true
        schema:
          title: Cluster Id
          type: string
      - description: The user of the kubeconfig file.
        in: query
        name: user
        required: false
        schema:
          nullable: true
          title: User
          type: string
      - description: The group of the kubeconfig file.
        in: query
        name: group
        required: false
        schema:
          nullable: true
          title: Group
          type: string
      - description: The time to live (TTL) of the kubeconfig file.
        in: query
        name: ttl
        required: false
        schema:
          nullable: true
          title: Ttl
          type: string
      - description: The header to encrypt the kubeconfig file.
        in: header
        name: x-encrypt-nacl
        required: false
        schema:
          nullable: true
          title: X-Encrypt-Nacl
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubeconfigResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Post Cluster Kubeconfig
      tags:
      - Clusters
  /clusters/{cluster_id}/upgrade:
    patch:
      description: Upgrades a specific cluster to the latest available version of
        Kubernetes. For more information, see [GetKubernetesVersions](#getkubenetesversions).
      operationId: UpgradeCluster
      parameters:
      - description: The ID of the cluster.
        in: path
        name: cluster_id
        required: true
        schema:
          title: Cluster Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Upgrade Cluster
      tags:
      - Clusters
  /projects:
    get:
      description: Lists one or more of your projects. The response can be filtered
        using the parameters.
      operationId: ListProjects
      parameters:
      - description: The name of the projects.
        in: query
        name: name
        required: false
        schema:
          nullable: true
          title: Name
          type: string
      - description: The status of the projects.
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - ready
          - deploying
          - updating
          - upgrading
          - failed
          - deleting
          nullable: true
          title: Status
          type: string
      - description: The IP ranges for the projects, IN CIDR notation (for example,
          `192.0.2.0/16`).
        in: query
        name: cidr
        required: false
        schema:
          default: 10.50.0.0/16
          nullable: true
          title: Cidr
          type: string
      - description: If true, returns deleted projects.
        in: query
        name: deleted
        required: false
        schema:
          nullable: true
          title: Deleted
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Projects
      tags:
      - Projects
    post:
      description: Creates a new project.
      operationId: CreateProject
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Create Project
      tags:
      - Projects
  /projects/{project_id}:
    delete:
      description: Deletes a specific project.
      operationId: DeleteProject
      parameters:
      - description: The ID of the project.
        in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Delete Project
      tags:
      - Projects
    get:
      description: Gets information about a specific project.
      operationId: GetProject
      parameters:
      - description: The ID of the project.
        in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Project
      tags:
      - Projects
    patch:
      description: Updates the details of an existing project.
      operationId: UpdateProject
      parameters:
      - description: The ID of the project.
        in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Update Project
      tags:
      - Projects
  /projects/{project_id}/quotas:
    get:
      description: Gets the quota details for a specific project.
      operationId: GetProjectQuotas
      parameters:
      - description: The ID of the project.
        in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotasResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Project Quotas
      tags:
      - Projects
  /templates/cluster:
    get:
      description: Gets the default cluster template, including the predefined control
        plane configurations, networking settings, and maintenance schedules.
      operationId: GetClusterTemplate
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse_ClusterInput_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Cluster Template
      tags:
      - Templates
  /templates/nodepool:
    get:
      description: Gets the default node pool template, including the predefined configurations
        for node scaling, storage, and upgrade strategies.
      operationId: GetNodepoolTemplate
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse_Nodepool_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Nodepool Template
      tags:
      - Templates
  /templates/project:
    get:
      description: Gets the default project template, including the predefined network
        configurations, Region, and metadata.
      operationId: GetProjectTemplate
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse_ProjectInput_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: The HTTP 422 response (Validation Error).
      summary: Get Project Template
      tags:
