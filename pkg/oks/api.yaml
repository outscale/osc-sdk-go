openapi: 3.1.0
info:
  title: OKS API
  description: |-
    The OKS API enables you to interact with OUTSCALE Kubernetes as a Service (OKS), a managed Kubernetes service on the OUTSCALE Cloud.

    In OKS, each cluster is linked to a project. In a project, you can have several clusters. Templates are also available for different resources.<br />For more information about the service, see [About OKS](https://docs.outscale.com/en/userguide/About-OKS.html).

    An OpenAPI description of this API is also available for download: <button>[oks.yaml](https://docs.outscale.com/_attachments/oks.yaml)</button>
  version: '1.0'
paths:
  /projects:
    post:
      tags:
      - Projects
      summary: Create Project
      description: Creates a new project.
      operationId: CreateProject
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Projects
      summary: Get Projects
      description: Lists one or more of your projects. The response can be filtered using the parameters.
      operationId: ListProjects
      parameters:
      - name: name
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Name
        description: The name of the projects.
      - name: status
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Status
        description: The status of the projects.
      - name: cidr
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Cidr
        description: The IP ranges for the projects, IN CIDR notation (for example, `192.0.2.0/16`).
      - name: deleted
        in: query
        required: false
        schema:
          nullable: true
          type: boolean
          title: Deleted
        description: If true, returns deleted projects.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}:
    get:
      tags:
      - Projects
      summary: Get Project
      description: Gets information about a specific project.
      operationId: GetProject
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
        description: The ID of the project.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: Update Project
      description: Updates the details of an existing project.
      operationId: UpdateProject
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
        description: The ID of the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Projects
      summary: Delete Project
      description: Deletes a specific project.
      operationId: DeleteProject
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
        description: The ID of the project.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/quotas:
    get:
      tags:
      - Projects
      summary: Get Project Quotas
      description: Gets the quota details for a specific project.
      operationId: GetProjectQuotas
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
        description: The ID of the project.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/projects__project_schema__QuotasResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/snapshots:
    get:
      tags:
      - Projects
      summary: Get Project Snapshots
      description: Retrieves the snapshot details for a specific project by its ID. Returns the snapshot information associated with the specified project.
      operationId: GetProjectSnapshots
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
        description: The ID of the project.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/public_ips:
    get:
      tags:
      - Projects
      summary: Get Project Quotas
      description: Retrieves the Public IP details for a specific project by its ID. Returns the public IP information associated with the specified project.
      operationId: GetProjectPublicIps
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
        description: The ID of the project.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIpsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters:
    post:
      tags:
      - Clusters
      summary: Create Cluster
      description: Creates a cluster with the provided configuration.
      operationId: CreateCluster
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Clusters
      summary: Get Clusters
      description: Lists one or more clusters associated with a project. The response can be filtered using the parameters.
      operationId: ListClustersByProjectID
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Project Id
        description: The ID of the project.
      - name: name
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Name
        description: The name of the clusters.
      - name: status
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Status
        description: The status of the clusters.
      - name: version
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Version
        description: The version of the clusters.
      - name: deleted
        in: query
        required: false
        schema:
          nullable: true
          type: boolean
          title: Deleted
        description: If true, returns deleted clusters.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponseList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters/all:
    get:
      tags:
      - Clusters
      summary: Get All Clusters
      description: Lists one or more of your clusters. The response can be filtered using the parameters.
      operationId: ListAllClusters
      parameters:
      - name: name
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Name
        description: The name of the clusters.
      - name: status
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Status
        description: The status of the clusters.
      - name: version
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Version
        description: The version of the clusters.
      - name: deleted
        in: query
        required: false
        schema:
          nullable: true
          type: boolean
          title: Deleted
        description: If true, returns deleted clusters.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponseList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters/{cluster_id}:
    get:
      tags:
      - Clusters
      summary: Get Cluster
      description: Gets information about a specific cluster.
      operationId: GetCluster
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: string
          title: Cluster Id
        description: The name of the cluster.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Clusters
      summary: Update Cluster
      description: Updates the configuration of an existing cluster.
      operationId: UpdateCluster
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: string
          title: Cluster Id
        description: The ID of the cluster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Clusters
      summary: Delete Cluster
      description: Deletes a specific cluster.
      operationId: DeleteCluster
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: string
          title: Cluster Id
        description: The ID of the cluster.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters/{cluster_id}/kubeconfig:
    get:
      tags:
      - Clusters
      summary: Get Cluster Kubeconfig
      description: Gets the kubeconfig file for a specific cluster. You can specify query parameters for the kubeconfig file.
      operationId: GetKubeconfig
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: string
          title: Cluster Id
        description: The ID of the cluster.
      - name: user
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: User
        description: The user of the kubeconfig file.
      - name: group
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Group
        description: The group of the kubeconfig file.
      - name: ttl
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Ttl
        description: The time to live (TTL) of the kubeconfig file.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubeconfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Clusters
      summary: Post Cluster Kubeconfig
      description: Gets the kubeconfig file for a specific cluster, optionally encrypted with a NaCl public key. For more information, see the [NaCl website](https://nacl.cr.yp.to/). You can specify query parameters for the kubeconfig file.
      operationId: GetKubeconfigWithPubkeyNACL
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: string
          title: Cluster Id
        description: The ID of the cluster.
      - name: user
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: User
        description: The user of the kubeconfig file.
      - name: group
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Group
        description: The group of the kubeconfig file.
      - name: ttl
        in: query
        required: false
        schema:
          nullable: true
          type: string
          title: Ttl
        description: The time to live (TTL) of the kubeconfig file.
      - name: x-encrypt-nacl
        in: header
        required: false
        schema:
          nullable: true
          type: string
          title: X-Encrypt-Nacl
        description: The header to encrypt the kubeconfig file.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubeconfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters/{cluster_id}/upgrade:
    patch:
      tags:
      - Clusters
      summary: Upgrade Cluster
      description: Upgrades a specific cluster to the latest available version of Kubernetes. For more information, see [GetKubernetesVersions](#getkubenetesversions).
      operationId: UpgradeCluster
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: string
          title: Cluster Id
        description: The ID of the cluster.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters/limits/kubernetes_versions:
    get:
      tags:
      - Clusters
      summary: Get Kubernetes Versions
      description: Gets the available Kubernetes versions for cluster creation or upgrades.
      operationId: GetKubenetesVersions
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesVersionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters/limits/cp_subregions:
    get:
      tags:
      - Clusters
      summary: Get Cp Subregions
      description: Gets the Subregions where you can deploy control planes for your clusters.
      operationId: GetCPSubregions
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CPSubregionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clusters/limits/control_plane_plans:
    get:
      tags:
      - Clusters
      summary: Get Control Plane Plans
      description: Gets the control plane types that you can use to create your clusters.
      operationId: GetControlPlanePlans
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPlanesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /templates/project:
    get:
      tags:
      - Templates
      summary: Get Project Template
      description: Gets the default project template, including the predefined network configurations, Region, and metadata.
      operationId: GetProjectTemplate
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse_ProjectInput_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /templates/cluster:
    get:
      tags:
      - Templates
      summary: Get Cluster Template
      description: Gets the default cluster template, including the predefined control plane configurations, networking settings, and maintenance schedules.
      operationId: GetClusterTemplate
      parameters:
      - name: X-Real-IP
        in: header
        required: false
        schema:
          nullable: true
          type: string
          title: X-Real-Ip
        description: A header with the IP of the client making the request.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse_ClusterInputTemplate_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /templates/nodepool:
    get:
      tags:
      - Templates
      summary: Get Nodepool Template
      description: Gets the default node pool template, including the predefined configurations for node scaling, storage, and upgrade strategies.
      operationId: GetNodepoolTemplate
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse_Nodepool_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /quotas:
    get:
      tags:
      - Quotas
      summary: Get Quotas
      description: Get OKS Quotas.
      operationId: GetQuotas
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quotas__quota_schema__QuotasResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AdmissionFlags:
      properties:
        disable_admission_plugins:
          items:
            type: string
          type: array
          title: Disable Admission Plugins
          description: The list of Kubernetes admission plugins that are disabled.
          default: []
        enable_admission_plugins:
          items:
            type: string
          type: array
          title: Enable Admission Plugins
          description: The list of Kubernetes admission plugins that are enabled.
          default: []
        applied_admission_plugins:
          items:
            type: string
          type: array
          title: Applied Admission Plugins
          description: The list of admission plugins that are currently applied to the cluster.
          default:
          - CertificateApproval
          - CertificateSigning
          - CertificateSubjectRestriction
          - ClusterTrustBundleAttest
          - DefaultIngressClass
          - DefaultStorageClass
          - DefaultTolerationSeconds
          - LimitRanger
          - MutatingAdmissionWebhook
          - NamespaceLifecycle
          - PersistentVolumeClaimResize
          - PodSecurity
          - Priority
          - ResourceQuota
          - RuntimeClass
          - ServiceAccount
          - StorageObjectInUseProtection
          - TaintNodesByCondition
          - ValidatingAdmissionPolicy
          - ValidatingAdmissionWebhook
      type: object
      title: AdmissionFlags
      description: Information about the Kubernetes admission plugins configuration.
    AdmissionFlagsInput:
      properties:
        disable_admission_plugins:
          items:
            type: string
          type: array
          title: Disable Admission Plugins
          description: The list of Kubernetes admission plugins to disable.
        enable_admission_plugins:
          items:
            type: string
          type: array
          title: Enable Admission Plugins
          description: The list of Kubernetes admission plugins to enable.
      type: object
      title: AdmissionFlagsInput
      description: Information about the Kubernetes admission plugins.
    AutoMaintenances:
      properties:
        minor_upgrade_maintenance:
          allOf:
          - $ref: '#/components/schemas/MaintenanceWindow'
          title: Minor Upgrade Maintenance
          description: The maintenance window configuration for minor Kubernetes upgrades.
        patch_upgrade_maintenance:
          allOf:
          - $ref: '#/components/schemas/MaintenanceWindow'
          title: Patch Upgrade Maintenance
          description: The maintenance window configuration for patch Kubernetes upgrades.
      type: object
      required:
      - minor_upgrade_maintenance
      - patch_upgrade_maintenance
      title: AutoMaintenances
      description: Information about the automated maintenance windows.
    AutoUpgradeMaintenance:
      properties:
        durationHours:
          type: integer
          title: Duration Hours
          description: The duration of the maintenance window, in hours.
        startHour:
          type: integer
          maximum: 23
          minimum: 0
          title: Start Hour
          description: The starting time of the maintenance window, in hours.
        weekDay:
          type: string
          enum:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
          title: Week Day
          description: The weekday on which the maintenance window begins.
      type: object
      required:
      - durationHours
      - startHour
      - weekDay
      title: AutoUpgradeMaintenance
      description: Information about the window of the automated upgrade maintenance.
    CPSubregionsResponse:
      properties:
        ResponseContext:
          $ref: '#/components/schemas/clusters__cluster_schema__ResponseContext'
          description: Information about the context of the response.
        CPSubregions:
          items:
            type: string
          type: array
          title: CP Subregions
          description: The list of Subregions where you can deploy control planes for your clusters.
      type: object
      required:
      - ResponseContext
      - CPSubregions
      title: CP Subregions Response
    Cluster:
      properties:
        project_id:
          type: string
          title: Project ID
          description: The ID of the project this cluster belongs to.
        id:
          type: string
          title: Cluster ID
          description: The Universally Unique Identifier (UUID) of the cluster.
        name:
          type: string
          title: Cluster Name
          description: A unique name for the cluster within the project.
        description:
          nullable: true
          type: string
          title: Description
          description: An optional description of the cluster.
          default: ''
        cp_multi_az:
          type: boolean
          title: Control Plane Multi-AZ
          description: If true, multi-Subregion deployment is enabled for the control plane. If false, it is disabled.
        cp_subregions:
          items:
            type: string
          type: array
          title: Control Plane Subregions
          description: The Subregions on which the control plane components are deployed.
        version:
          type: string
          title: Kubernetes Version
          description: The Kubernetes version deployed for the cluster. For more information, see [GetKubernetesVersions](#getkubenetesversions).
        expected_version:
          nullable: true
          type: string
          title: Expected Kubernetes Version
          description: The version of Kubernetes that is expected to be deployed during maintenance.
        cni:
          type: string
          title: CNI
          description: The Container Network Interface (CNI) used in the cluster.
        admin_lbu:
          type: boolean
          title: Admin LBU
          description: If true, load balancer administration is enabled for cluster management. If false, it is disabled.
        admission_flags:
          allOf:
          - $ref: '#/components/schemas/AdmissionFlags'
          title: Admission Flags
          description: The configuration of the Kubernetes admission controllers.
          default:
            disable_admission_plugins: []
            enable_admission_plugins: []
            applied_admission_plugins:
            - CertificateApproval
            - CertificateSigning
            - CertificateSubjectRestriction
            - ClusterTrustBundleAttest
            - DefaultIngressClass
            - DefaultStorageClass
            - DefaultTolerationSeconds
            - LimitRanger
            - MutatingAdmissionWebhook
            - NamespaceLifecycle
            - PersistentVolumeClaimResize
            - PodSecurity
            - Priority
            - ResourceQuota
            - RuntimeClass
            - ServiceAccount
            - StorageObjectInUseProtection
            - TaintNodesByCondition
            - ValidatingAdmissionPolicy
            - ValidatingAdmissionWebhook
        cidr_pods:
          nullable: true
          type: string
          title: Pods CIDR
          description: The CIDR block of the Kubernetes pods' network.
        cidr_service:
          nullable: true
          type: string
          title: Service CIDR
          description: The CIDR block of the Kubernetes services' network.
        cluster_dns:
          nullable: true
          type: string
          title: Cluster DNS
          description: The IP of the cluster's DNS service.
        tags:
          additionalProperties:
            type: string
          type: object
          title: Tags
